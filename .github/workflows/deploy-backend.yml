- name: Deploy to Beanstalk
      run: |
        # Create application version
        aws elasticbeanstalk create-application-version \
          --application-name three-tier-app \
          --version-label v-${{ github.sha }} \
          --source-bundle S3Bucket=threetierappfrontend,S3Key=deployments/app-${{ github.sha }}.zip || true

        # Wait for environment to be Ready (max 5 minutes)
        echo "Waiting for environment to be Ready..."
        for i in {1..30}; do
          STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name three-tier-app \
            --environment-names Three-tier-app-env \
            --query 'Environments[0].Status' \
            --output text)
          echo "Current status: $STATUS"
          if [ "$STATUS" = "Ready" ]; then
            echo "Environment is Ready!"
            break
          fi
          sleep 10
        done

        # Deploy
        aws elasticbeanstalk update-environment \
          --application-name three-tier-app \
          --environment-name Three-tier-app-env \
          --version-label v-${{ github.sha }}