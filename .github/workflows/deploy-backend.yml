name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches:
      - Three-tier-code
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v5

    - name: Install zip
      run: sudo apt-get install -y zip

    - name: Install Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd backend
        npm install --production

    - name: Zip Backend
      run: |
        cd backend
        zip -r ../app-${{ github.sha }}.zip . -x "node_modules/*"

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Upload ZIP to S3
      run: |
        aws s3 cp app-${{ github.sha }}.zip \
          s3://threetierappfrontend/deployments/app-${{ github.sha }}.zip

    - name: Deploy to Beanstalk
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name three-tier-app \
          --version-label v-${{ github.sha }} \
          --source-bundle S3Bucket=threetierappfrontend,S3Key=deployments/app-${{ github.sha }}.zip || true
        
        aws elasticbeanstalk update-environment \
          --application-name three-tier-app \
          --environment-name threetierapp-env \
          --version-label v-${{ github.sha }}